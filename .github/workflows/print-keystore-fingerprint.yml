name: Print Release Keystore Fingerprint (diagnostic)

# One-off diagnostic: prints the SHA-1/SHA-256 fingerprint of the release
# signing keystore so it can be registered with Firebase/Google Cloud
# Console for Google Sign-In. The fingerprint itself is not secret (it's
# meant to be shared with Google), so it's fine to print to the job log.
on:
  workflow_dispatch:

jobs:
  print-fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Decode release keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > release.jks

      - name: Print fingerprint
        run: |
          keytool -list -v -keystore release.jks -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.ANDROID_KEY_ALIAS }}" | grep -E "SHA1:|SHA256:|Alias name|Owner:"

      - name: Clean up
        if: always()
        run: rm -f release.jks
