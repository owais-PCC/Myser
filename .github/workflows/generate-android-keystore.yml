name: Generate Android Release Keystore (one-time)

# Manual-only, run once. Ubuntu runners ship a JDK with `keytool`
# preinstalled, which is why this runs in CI rather than locally — no local
# machine in this project's toolchain has a JDK on PATH. Generates a real
# release-signing keystore and uploads it as a short-lived, run-scoped
# artifact for a human to download and store somewhere durable (password
# manager, encrypted backup) — GitHub Actions artifacts are NOT that
# durable backup; they expire (see retention-days below) and are not a
# substitute for the operator keeping their own copy.
#
# ⚠️ This keystore signs every future release of this app. Losing it means
# losing the ability to publish updates under the same app identity on the
# Play Store — Google cannot recover or reissue it. Download the artifact
# from this run and back it up somewhere durable before deleting this
# workflow run or letting the artifact expire.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GENERATE to confirm you understand this creates a real signing key'
        required: true

jobs:
  generate:
    if: github.event.inputs.confirm == 'GENERATE'
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore myser-release.jks \
            -alias myser \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -storepass "${{ secrets.KEYSTORE_GEN_PASSWORD }}" \
            -keypass "${{ secrets.KEYSTORE_GEN_PASSWORD }}" \
            -dname "CN=Myser, OU=Myser, O=Myser, L=Unknown, ST=Unknown, C=US"

      - name: Base64-encode for easy secret storage
        run: base64 -w0 myser-release.jks > myser-release.jks.b64

      - name: Upload keystore (download this, then delete the run)
        uses: actions/upload-artifact@v4
        with:
          name: myser-release-keystore
          path: |
            myser-release.jks
            myser-release.jks.b64
          retention-days: 1
