name: Build iOS Simulator App (Appetize.io)

# Manual trigger only. macOS runners bill at a 10x minute multiplier on
# GitHub Actions — this is meant to be run on demand when we actually need
# to test something on iOS (e.g. verifying MYS-2's Apple sign-in), not on
# every push.
on:
  workflow_dispatch: {}

jobs:
  build-ios-simulator:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # @capacitor/cli 8.x requires Node >=22.
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          # firebase.ts reads these at module-init time, which runs during
          # static-export prerendering — without them the build fails with
          # "Firebase: Error (auth/invalid-api-key)" on any page that
          # touches Firebase. These are NEXT_PUBLIC_* values anyway (get
          # inlined into the client bundle regardless), so repo secrets are
          # just a convenient place to store them, not for confidentiality.
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_RECEIPT_SCAN_API_URL: ${{ secrets.NEXT_PUBLIC_RECEIPT_SCAN_API_URL }}

      - name: Install CocoaPods dependencies
        run: cd ios/App && pod install

      - name: Sync web build into iOS project
        run: npx cap sync ios

      - name: Build for iOS Simulator (ad-hoc signed, no Apple Developer account needed)
        run: |
          # Without an explicit -destination, ONLY_ACTIVE_ARCH=YES resolved
          # to x86_64-only on this arm64 runner (confirmed in a prior failed
          # run's log) — Appetize couldn't read/run a build built for the
          # wrong slice. Force a generic simulator destination and
          # ONLY_ACTIVE_ARCH=NO so both arm64 and x86_64 get built into one
          # universal binary, working regardless of Appetize's host arch.
          #
          # CODE_SIGN_IDENTITY="-" ad-hoc-signs the app locally (works on any
          # Mac, no certificates/Apple Developer account required) instead of
          # skipping signing entirely. A fully unsigned app has no
          # entitlements blob at all, which made FirebaseAuth's keychain
          # calls fail on a real device test ("SecItemCopyMatching -34018:
          # A required entitlement isn't present"). Ad-hoc signing still
          # produces a valid (if minimal) entitlements blob, which resolves
          # that without needing real code-signing credentials.
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=YES \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Locate the built .app
        run: |
          APP_PATH=$(find build/Build/Products -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app bundle found under build/Build/Products"
            find build/Build/Products
            exit 1
          fi
          echo "Found app at $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: myser-ios-simulator-app
          # Upload the .app folder itself, not a pre-made zip of it.
          # actions/upload-artifact always wraps whatever path you give it in
          # its own zip for download — pointing it at an already-zipped file
          # produces a zip-of-a-zip (myser-ios-simulator-app.zip containing
          # Myser-simulator.zip containing App.app), which confused Appetize
          # ("No .app folder found") when the outer zip was uploaded as-is.
          # Pointing it at the raw .app folder means the downloaded zip has
          # App.app directly at its root, ready to upload to Appetize as-is.
          path: ${{ env.APP_PATH }}
          retention-days: 14

# To use: run this workflow from the Actions tab, download the
# "myser-ios-simulator-app" artifact when it finishes — it's a single-level
# zip with App.app at its root — and drag it straight onto
# https://appetize.io/upload. No Apple Developer account or Mac needed to
# view/test the result, just a browser.
