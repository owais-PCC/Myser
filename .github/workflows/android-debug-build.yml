name: Build Android Debug APK (test/review)

# Manual trigger only. Unsigned/debug-signed build for testing a branch
# before it's trusted enough to go through the real signed-release
# pipeline (android-release.yml) — deliberately never touches the
# production release keystore, so it's safe to run against unreviewed or
# third-party code.
on:
  workflow_dispatch: {}

jobs:
  build-android-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_RECEIPT_SCAN_API_URL: ${{ secrets.NEXT_PUBLIC_RECEIPT_SCAN_API_URL }}

      - name: Write google-services.json
        run: echo "${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > android/app/google-services.json

      - name: Sync web build into Android project
        run: npx cap sync android

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        # assembleDebug signs with Gradle's auto-generated debug keystore
        # (~/.android/debug.keystore, created on the fly if missing) — no
        # secrets, no relation to the real release signing key.
        run: cd android && ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: myser-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# To use: run this workflow from the Actions tab against whichever branch
# you're reviewing, download the "myser-debug-apk" artifact when it
# finishes, and drag app-debug.apk onto https://appetize.io/upload to test
# it in a browser-based Android emulator — no phone, no local Android SDK
# needed.
